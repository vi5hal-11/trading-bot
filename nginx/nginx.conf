upstream bot      { server bot:8080; }
upstream frontend { server frontend:3000; }

server {
    listen 80;
    client_max_body_size 10m;

    # WebSocket — must be handled before the catch-all
    location /ws {
        proxy_pass http://bot;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # FastAPI REST endpoints
    location ~ ^/(health|start|stop|pause|resume|summary|positions|signals|trades|activity|risk|strategy|equity-curve|models|explain|api) {
        proxy_pass http://bot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
